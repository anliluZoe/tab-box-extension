<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>标签盒</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="brand-icon" src="icons/icon48.png" alt="" width="28" height="28" />
      <div class="brand-text">
        <div class="brand-name">标签盒</div>
        <div class="brand-sub">把散落的标签页收进盒子</div>
      </div>
    </div>
    <input id="search" type="search" placeholder="搜索标题 / 网址 / 域名，↑↓ 选择，回车跳转" autofocus autocomplete="off" />
  </header>

  <div class="toolbar">
    <button id="group-btn" class="primary" title="把每个窗口内相同域名的标签页合并成一个标签组">按域名分组</button>
    <button id="ungroup-btn" title="解散所有标签组，并暂时关闭自动分组">取消分组</button>
    <select id="sort">
      <option value="default">同域名靠在一起</option>
      <option value="least">访问最少优先</option>
      <option value="stale">最久未用优先</option>
    </select>
  </div>

  <div class="filters">
    <label class="filter"><input type="checkbox" id="auto-group" checked />自动分组</label>
    <label class="filter"><input type="checkbox" id="auto-dedupe" checked />自动去重</label>
    <label class="filter"><input type="checkbox" id="idle-only" />仅看闲置</label>
    <select id="idle-days" title="判断闲置的时间范围">
      <option value="1">近1天未访问</option>
      <option value="2" selected>近2天未访问</option>
      <option value="3">近3天未访问</option>
    </select>
  </div>

  <div class="status-row">
    <div id="summary"></div>
    <div class="meta-bar">
      <select id="theme" title="界面主题">
        <option value="system">跟随系统</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
      <span id="version-text"></span>
      <button type="button" id="check-update">检查更新</button>
    </div>
  </div>

  <ul id="tab-list"></ul>

  <footer>
    <button id="close-duplicates">关闭重复标签页</button>
    <button id="close-idle" class="danger">关闭近2天未访问</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
