name: Release on PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_edge:
        description: '自动上传到 Edge 加载项商店草稿区'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publish_edge:
        description: '上传后自动提交审核（会先执行 upload_edge）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 从 main 检出：PR 事件默认检出的 refs/pull/N/merge 不在 main 历史里，没法往上提交版本号
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          SOURCE_SHA=$(git rev-parse HEAD)
          # manifest 里是 __MSG_extName__ 占位，浏览器内的真实英文名在默认语言包里
          NAME=$(node -p "require('./_locales/en/messages.json').extName.message" 2>/dev/null || echo "Tab Box")
          case "$NAME" in
            __MSG_*)
              echo "::error::无法解析英文扩展名，请检查 _locales/en/messages.json 的 extName"
              exit 1
              ;;
          esac

          released() {
            git rev-parse "refs/tags/$1" >/dev/null 2>&1 || gh release view "$1" >/dev/null 2>&1
          }

          # 版本号只允许 1-4 段 0-65535 的整数（Chromium 的限制），末段 +1
          next_version() {
            node -e '
          const v = String(process.argv[1]).split(".").map((s) => Number(s));
          if (v.length < 1 || v.length > 4 || v.some((n) => !Number.isInteger(n) || n < 0 || n > 65535)) {
            process.exit(2);
          }
          while (v.length < 3) v.push(0);
          v[v.length - 1] += 1;
          process.stdout.write(v.join("."));
          ' "$1"
          }

          BUMPED=false
          if released "v${VERSION}"; then
            OLD_VERSION="$VERSION"
            if ! VERSION=$(next_version "$OLD_VERSION"); then
              echo "::error::manifest.json 的 version 不是合法版本号（1-4 段 0-65535 整数）：$OLD_VERSION"
              exit 1
            fi
            while released "v${VERSION}"; do
              VERSION=$(next_version "$VERSION")
            done

            cat > /tmp/bump-version.js <<'EOF'
          const fs = require('fs');
          const next = process.argv[2];
          const before = fs.readFileSync('manifest.json', 'utf8');
          const after = before.replace(/"version":\s*"[^"]+"/, `"version": "${next}"`);
          if (after === before) {
            console.error('manifest.json 里找不到 version 字段');
            process.exit(1);
          }
          fs.writeFileSync('manifest.json', after);
          EOF
            node /tmp/bump-version.js "$VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore(release): v${VERSION} [skip ci]"
            if ! git push origin HEAD:main; then
              echo "::error::无法把版本号提交推回 main，可能被分支保护规则拦住。"
              echo "::error::请允许 github-actions[bot] 直接推送，或在 PR 里手动改 manifest.json 的 version。"
              exit 1
            fi

            BUMPED=true
            echo "::notice::版本 ${OLD_VERSION} 已经发布过，自动递增到 ${VERSION}"
          else
            echo "::notice::使用 manifest.json 里的版本 ${VERSION}（PR 里已手动改过）"
          fi

          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "unpacked=tab-box-${TAG}.zip" >> "$GITHUB_OUTPUT"
          echo "edge-store=tab-box-${TAG}-edge-store.zip" >> "$GITHUB_OUTPUT"
          echo "chrome-store=tab-box-${TAG}-chrome-store.zip" >> "$GITHUB_OUTPUT"

      - name: Build packages
        env:
          UNPACKED: ${{ steps.meta.outputs.unpacked }}
          EDGE_STORE: ${{ steps.meta.outputs.edge-store }}
          CHROME_STORE: ${{ steps.meta.outputs.chrome-store }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          # 1) 本地安装用：外面套一层 tab-box/，解压即得可加载的文件夹
          rm -rf tab-box
          mkdir -p tab-box
          cp manifest.json background.js popup.html popup.css popup.js quick-search.js quick-search.css quick-search.html README.md LICENSE tab-box/
          cp -R icons tab-box/icons
          cp -R _locales tab-box/_locales
          zip -r -X "$UNPACKED" tab-box -x "*.DS_Store"

          # 2) Edge 商店用：manifest.json 必须在 zip 根目录，不能有顶层文件夹
          #    文件清单与 scripts/build-store-package.ps1 保持一致
          zip -r -X "$EDGE_STORE" manifest.json background.js popup.html popup.css popup.js quick-search.js quick-search.css quick-search.html LICENSE icons _locales -x "*.DS_Store"

          # 3) Chrome Web Store 用：包结构与 Edge 相同，manifest.json 必须在根目录
          zip -r -X "$CHROME_STORE" manifest.json background.js popup.html popup.css popup.js quick-search.js quick-search.css quick-search.html LICENSE icons _locales -x "*.DS_Store"

          for STORE_PKG in "$EDGE_STORE" "$CHROME_STORE"; do
            STORE_NAME=$(basename "$STORE_PKG")

            # 自检 1：根目录必须有 manifest.json
            if ! unzip -Z1 "$STORE_PKG" | grep -qx 'manifest.json'; then
              echo "::error::${STORE_NAME} 根目录缺少 manifest.json"; exit 1
            fi
            # 自检 2：manifest.json 不能被顶层文件夹包裹
            if unzip -Z1 "$STORE_PKG" | grep -qE '^[^/]+/manifest\.json$'; then
              echo "::error::${STORE_NAME} 里 manifest.json 被顶层文件夹包裹，商店会拒收"; exit 1
            fi
            # 自检 3：条目分隔符必须是正斜杠
            if unzip -Z1 "$STORE_PKG" | grep -q '\\'; then
              echo "::error::${STORE_NAME} 的压缩包条目使用了反斜杠分隔符"; exit 1
            fi
            # 自检 4：包内版本号与本次发布版本一致
            INNER_VERSION=$(unzip -p "$STORE_PKG" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if [ "$INNER_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "::error::${STORE_NAME} 的包内版本 $INNER_VERSION 与发布版本 $EXPECTED_VERSION 不一致"; exit 1
            fi
          done

          sha256sum "$UNPACKED" "$EDGE_STORE" "$CHROME_STORE" | tee SHA256SUMS.txt
          echo "--- $EDGE_STORE ---"
          unzip -l "$EDGE_STORE"
          echo "--- $CHROME_STORE ---"
          unzip -l "$CHROME_STORE"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          UNPACKED: ${{ steps.meta.outputs.unpacked }}
          EDGE_STORE: ${{ steps.meta.outputs.edge-store }}
          CHROME_STORE: ${{ steps.meta.outputs.chrome-store }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT: ${{ steps.meta.outputs.source-sha }}
          BUMPED: ${{ steps.meta.outputs.bumped }}
        run: |
          set -euo pipefail
          {
            echo "## ${NAME} ${TAG}"
            echo
            echo "自动打包自合并到 \`main\` 的变更。"
            echo
            echo "### 下载"
            echo
            echo "| 文件 | 用途 |"
            echo "| --- | --- |"
            echo "| \`${UNPACKED}\` | 解压得到 \`tab-box/\`，本地「加载解压缩的扩展」 |"
            echo "| \`${EDGE_STORE}\` | \`manifest.json\` 在根目录，直接上传 Edge 加载项商店 |"
            echo "| \`${CHROME_STORE}\` | \`manifest.json\` 在根目录，直接上传 Chrome Web Store |"
            echo
            echo "### 本地安装"
            echo "1. 下载 \`${UNPACKED}\` 并解压（得到 \`tab-box\` 文件夹）"
            echo "2. 打开 \`edge://extensions/\` 或 \`chrome://extensions/\`"
            echo "3. 开启开发者模式 → 加载解压缩的扩展 → 选择 \`tab-box\`"
            echo
            echo "### 上传 Edge 商店"
            echo "1. 打开 https://partner.microsoft.com/dashboard/microsoftedge ，进入本扩展"
            echo "2. 「更新」→ 上传 \`${EDGE_STORE}\`"
            echo "3. 更新 listing 后提交审核"
            echo
            echo "### 上传 Chrome Web Store"
            echo "1. 打开 https://chrome.google.com/webstore/devconsole ，进入本扩展"
            echo "2. 「软件包」→「上传新软件包」，选择 \`${CHROME_STORE}\`"
            echo "3. 更新 listing 后提交审核"
            echo
            echo "### 校验和"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "### 来源"
            if [ -n "${PR_NUMBER}" ]; then
              echo "- PR #${PR_NUMBER}: ${PR_TITLE}"
            else
              echo "- 手动触发"
            fi
            echo "- Commit: ${COMMIT}"
            if [ "${BUMPED}" = "true" ]; then
              echo
              echo "> 版本号由 CI 自动递增（原版本已发布过），已提交回 \`main\`。"
            fi
          } > RELEASE_NOTES.md

          gh release create "$TAG" "$UNPACKED" "$EDGE_STORE" "$CHROME_STORE" SHA256SUMS.txt \
            --title "${NAME} ${TAG}" \
            --target "$(git rev-parse HEAD)" \
            --notes-file RELEASE_NOTES.md
          echo "Release: https://github.com/${REPO}/releases/tag/${TAG}"

      - name: Upload to Microsoft Edge Add-ons
        id: edge_upload
        if: github.event.inputs.upload_edge == 'true' || github.event.inputs.publish_edge == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_STORE: ${{ steps.meta.outputs.edge-store }}
        run: |
          set -euo pipefail
          API="https://api.addons.microsoftedge.microsoft.com"

          missing=""
          [ -n "$EDGE_PRODUCT_ID" ] || missing="$missing EDGE_PRODUCT_ID"
          [ -n "$EDGE_CLIENT_ID" ] || missing="$missing EDGE_CLIENT_ID"
          [ -n "$EDGE_API_KEY" ] || missing="$missing EDGE_API_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::缺少 Edge API 凭据:$missing，已跳过自动上传。"
            echo "::warning::在仓库 Settings → Secrets and variables → Actions 里补齐后重跑即可。"
            exit 0
          fi

          echo "上传 $EDGE_STORE 到 product $EDGE_PRODUCT_ID"
          hdr=$(mktemp)
          body=$(mktemp)
          code=$(curl -sS -o "$body" -D "$hdr" -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Type: application/zip" \
            --data-binary @"$EDGE_STORE" \
            "$API/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package") || code=000

          if [ "$code" != "202" ]; then
            echo "::error::上传失败，HTTP $code"
            cat "$body"
            echo
            exit 1
          fi

          op=$(grep -i '^location:' "$hdr" | tr -d '\r' | tail -1 | awk '{print $2}' | awk -F'/' '{print $NF}' || true)
          rm -f "$hdr" "$body"
          if [ -z "$op" ]; then
            echo "::error::响应里没有 Location，拿不到 operation ID"
            exit 1
          fi
          echo "operation-id=$op" >> "$GITHUB_OUTPUT"
          echo "上传已受理，operation ID: $op"

          for i in $(seq 1 40); do
            sleep 10
            res=$(curl -sS \
              -H "Authorization: ApiKey $EDGE_API_KEY" \
              -H "X-ClientID: $EDGE_CLIENT_ID" \
              "$API/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package/operations/$op")
            status=$(printf '%s' "$res" | jq -r '.status // empty' 2>/dev/null || true)
            echo "[$i] 包校验状态: $status"
            case "$status" in
              Succeeded)
                echo "包校验通过"
                exit 0
                ;;
              Failed)
                echo "::error::包校验失败"
                echo "$res"
                exit 1
                ;;
            esac
          done
          echo "::error::等待包校验超时（约 6 分钟），请到 Partner Center 查看"
          exit 1

      - name: Publish Edge submission
        if: github.event.inputs.publish_edge == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          API="https://api.addons.microsoftedge.microsoft.com"
          notes="Automated submission from GitHub Actions for ${TAG}."

          if [ -z "$EDGE_PRODUCT_ID" ] || [ -z "$EDGE_CLIENT_ID" ] || [ -z "$EDGE_API_KEY" ]; then
            echo "::warning::缺少 Edge API 凭据，跳过提交审核（包已上传到草稿区的话，可到 Partner Center 手动提交）。"
            exit 0
          fi

          hdr=$(mktemp)
          body=$(mktemp)
          code=$(curl -sS -o "$body" -D "$hdr" -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Type: application/json" \
            -d "{\"notes\": \"$notes\"}" \
            "$API/v1/products/$EDGE_PRODUCT_ID/submissions") || code=000

          if [ "$code" != "202" ]; then
            echo "JSON body 未被接受（HTTP $code），改用纯文本重试"
            code=$(curl -sS -o "$body" -D "$hdr" -w "%{http_code}" \
              -X POST \
              -H "Authorization: ApiKey $EDGE_API_KEY" \
              -H "X-ClientID: $EDGE_CLIENT_ID" \
              -H "Content-Type: text/plain" \
              --data-binary "$notes" \
              "$API/v1/products/$EDGE_PRODUCT_ID/submissions") || code=000
          fi

          if [ "$code" != "202" ]; then
            echo "::error::提交审核失败，HTTP $code"
            cat "$body"
            echo
            exit 1
          fi

          op=$(grep -i '^location:' "$hdr" | tr -d '\r' | tail -1 | awk '{print $2}' | awk -F'/' '{print $NF}' || true)
          rm -f "$hdr" "$body"
          if [ -z "$op" ]; then
            echo "::warning::响应里没有 Location，请到 Partner Center 确认提交状态"
            exit 0
          fi
          echo "提交已受理，operation ID: $op"

          for i in $(seq 1 30); do
            sleep 10
            res=$(curl -sS \
              -H "Authorization: ApiKey $EDGE_API_KEY" \
              -H "X-ClientID: $EDGE_CLIENT_ID" \
              "$API/v1/products/$EDGE_PRODUCT_ID/submissions/operations/$op")
            status=$(printf '%s' "$res" | jq -r '.status // empty' 2>/dev/null || true)
            echo "[$i] 提交状态: $status"
            case "$status" in
              Succeeded)
                echo "已提交审核"
                exit 0
                ;;
              Failed)
                echo "::error::提交审核失败"
                echo "$res"
                exit 1
                ;;
            esac
          done
          echo "::warning::提交状态尚未结束，请到 Partner Center 确认"
