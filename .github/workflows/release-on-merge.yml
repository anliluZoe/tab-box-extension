name: Release on PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          NAME=$(node -p "require('./manifest.json').name")
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            TAG="v${VERSION}-${SHORT_SHA}"
            echo "::warning::版本 ${VERSION} 已有同名 tag，本次 release 追加了 commit 后缀。商店不接受重复版本号，要提交商店请先递增 manifest.json 的 version。"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "unpacked=tab-box-${TAG}.zip" >> "$GITHUB_OUTPUT"
          echo "store=tab-box-${TAG}-edge-store.zip" >> "$GITHUB_OUTPUT"

      - name: Build packages
        env:
          UNPACKED: ${{ steps.meta.outputs.unpacked }}
          STORE: ${{ steps.meta.outputs.store }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          # 1) 本地安装用：外面套一层 tab-box/，解压即得可加载的文件夹
          rm -rf tab-box
          mkdir -p tab-box
          cp manifest.json background.js popup.html popup.css popup.js README.md LICENSE tab-box/
          cp -R icons tab-box/icons
          zip -r -X "$UNPACKED" tab-box -x "*.DS_Store"

          # 2) Edge 商店用：manifest.json 必须在 zip 根目录，不能有顶层文件夹
          #    文件清单与 scripts/build-edge-package.ps1 保持一致
          zip -r -X "$STORE" manifest.json background.js popup.html popup.css popup.js LICENSE icons -x "*.DS_Store"

          # 自检 1：根目录必须有 manifest.json
          if ! unzip -Z1 "$STORE" | grep -qx 'manifest.json'; then
            echo "::error::商店包根目录缺少 manifest.json"; exit 1
          fi
          # 自检 2：manifest.json 不能被顶层文件夹包裹
          if unzip -Z1 "$STORE" | grep -qE '^[^/]+/manifest\.json$'; then
            echo "::error::商店包里 manifest.json 被顶层文件夹包裹，商店会拒收"; exit 1
          fi
          # 自检 3：条目分隔符必须是正斜杠
          if unzip -Z1 "$STORE" | grep -q '\\'; then
            echo "::error::压缩包条目使用了反斜杠分隔符"; exit 1
          fi
          # 自检 4：包内版本号与本次发布版本一致
          INNER_VERSION=$(unzip -p "$STORE" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$INNER_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::包内版本 $INNER_VERSION 与发布版本 $EXPECTED_VERSION 不一致"; exit 1
          fi

          sha256sum "$UNPACKED" "$STORE" | tee SHA256SUMS.txt
          echo "--- $STORE ---"
          unzip -l "$STORE"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          UNPACKED: ${{ steps.meta.outputs.unpacked }}
          STORE: ${{ steps.meta.outputs.store }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "## ${NAME} ${TAG}"
            echo
            echo "自动打包自合并到 \`main\` 的变更。"
            echo
            echo "### 下载"
            echo
            echo "| 文件 | 用途 |"
            echo "| --- | --- |"
            echo "| \`${UNPACKED}\` | 解压得到 \`tab-box/\`，本地「加载解压缩的扩展」 |"
            echo "| \`${STORE}\` | \`manifest.json\` 在根目录，直接上传 Edge 加载项商店 |"
            echo
            echo "### 本地安装"
            echo "1. 下载 \`${UNPACKED}\` 并解压（得到 \`tab-box\` 文件夹）"
            echo "2. 打开 \`edge://extensions/\` 或 \`chrome://extensions/\`"
            echo "3. 开启开发者模式 → 加载解压缩的扩展 → 选择 \`tab-box\`"
            echo
            echo "### 上传 Edge 商店"
            echo "1. 打开 https://partner.microsoft.com/dashboard/microsoftedge ，进入本扩展"
            echo "2. 「更新」→ 上传 \`${STORE}\`"
            echo "3. 更新 listing 后提交审核"
            echo
            echo "### 校验和"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "### 来源"
            if [ -n "${PR_NUMBER}" ]; then
              echo "- PR #${PR_NUMBER}: ${PR_TITLE}"
            else
              echo "- 手动触发"
            fi
            echo "- Commit: ${COMMIT}"
          } > RELEASE_NOTES.md

          gh release create "$TAG" "$UNPACKED" "$STORE" SHA256SUMS.txt \
            --title "${NAME} ${TAG}" \
            --notes-file RELEASE_NOTES.md
          echo "Release: https://github.com/${REPO}/releases/tag/${TAG}"
